    <script>
        let estoqueCloud = {}; 
        let precosModificadosManualmente = {};
        let vendasRealizadas = [];
        let cupomAtual = [];
        let totalVenda = 0;
        let listaFiltrada = [];
        let faturamentoVisivel = false; 
        
        let clientesDB = {}; 
        let clienteEmEdicao = null;
        
        let indiceSelecionadoSugestoes = -1;
        let indiceSelecionadoBalanca = -1;
        let indiceSelecionadoEdicao = -1;
        let timeoutBusca = null;

        // CORREÇÃO: Carrega sempre da nuvem (GitHub) ao abrir o sistema
        window.onload = async function() {
            document.getElementById('cloud-repo').value = localStorage.getItem('cloud_repo') || 'rafaelxt1033-gif/pdvmercadodoluiz';
            document.getElementById('cloud-token').value = localStorage.getItem('cloud_token') || '';
            
            const vendasSalvas = localStorage.getItem('vendas') || localStorage.getItem('vendas_realizadas');
            if (vendasSalvas) { try { vendasRealizadas = JSON.parse(vendasSalvas); } catch(e) { vendasRealizadas = []; } }
            
            const clientesSalvos = localStorage.getItem('clientes_mercado');
            if (clientesSalvos) clientesDB = JSON.parse(clientesSalvos);
            atualizarSelectClientes();

            const locais = localStorage.getItem('precos_modificados');
            if (locais) precosModificadosManualmente = JSON.parse(locais);

            // Força a busca atualizada na nuvem sempre que a página carrega
            await carregarEstoqueCompletoDaNuvem();

            for (let c in precosModificadosManualmente) {
                if (typeof precosModificadosManualmente[c] === 'object' && precosModificadosManualmente[c] !== null) {
                    estoqueCloud[c] = precosModificadosManualmente[c];
                } else if (estoqueCloud[c]) {
                    estoqueCloud[c].preco = precosModificadosManualmente[c];
                }
            }

            localStorage.setItem('estoque_mercado', JSON.stringify(estoqueCloud));
            document.getElementById('contador-produtos').innerText = Object.keys(estoqueCloud).length;
            atualizarDashboard();
            
            document.addEventListener('keydown', (e) => { 
                if (e.key === 'F4') { e.preventDefault(); finalizarVenda(true); }
                if (e.key === 'F2') { e.preventDefault(); finalizarVenda(false); }
                if (e.key === 'F3') { e.preventDefault(); document.getElementById('forma-pagamento').focus(); }
            });
            manterFocoNoInput();
        };

        // CORREÇÃO: Função necessária para renderizar os produtos no Painel ADM
        function renderizarTabelaAdm() {
            const tbody = document.getElementById('tabela-estoque-corpo');
            if (!tbody) return;
            tbody.innerHTML = '';
            
            let count = 0;
            for (let cod in estoqueCloud) {
                let prod = estoqueCloud[cod];
                if (!prod) continue;
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${cod}</td>
                    <td>${prod.nome || 'Sem nome'}</td>
                    <td>R$ ${parseFloat(prod.preco || 0).toFixed(2)}</td>
                `;
                tbody.appendChild(tr);
                count++;
            }
            document.getElementById('contador-produtos').innerText = count;
        }

        // ==========================================
        // MÓDULO: GESTÃO DE CLIENTES
        // ==========================================
        function atualizarSelectClientes() {
            const select = document.getElementById('cliente-selecionado');
            select.innerHTML = '<option value="">Consumidor Final (Sem Vínculo)</option>';
            for (let id in clientesDB) {
                select.innerHTML += `<option value="${id}">${clientesDB[id].nome} (Devendo: R$ ${clientesDB[id].divida.toFixed(2)})</option>`;
            }
        }

        function cadastrarCliente() {
            const nome = document.getElementById('novo-cliente-nome').value.trim();
            const tel = document.getElementById('novo-cliente-tel').value.trim();
            if (!nome) return alert("O nome do cliente é obrigatório!");
            const id = 'CLI_' + Date.now();
            
            clientesDB[id] = { 
                nome: nome, 
                telefone: tel, 
                pontos: 0, 
                divida: 0,
                dataObs: new Date().toLocaleDateString('pt-BR')
            };
            
            salvarClientes();
            document.getElementById('novo-cliente-nome').value = ''; 
            document.getElementById('novo-cliente-tel').value = '';
            alert("Cliente cadastrado com sucesso!");
        }

        function salvarClientes() {
            localStorage.setItem('clientes_mercado', JSON.stringify(clientesDB));
            atualizarSelectClientes();
            if (document.getElementById('tela-adm').classList.contains('ativa')) renderizarTabelaClientes();
        }

        function renderizarTabelaClientes() {
            const tbody = document.getElementById('tabela-clientes-corpo'); 
            tbody.innerHTML = '';
            for (let id in clientesDB) {
                let cli = clientesDB[id];
                let corDivida = cli.divida > 0 ? 'color: var(--erro); font-weight: bold;' : 'color: var(--sucesso);';
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${cli.nome}</strong></td>
                        <td>${cli.telefone || '-'}</td>
                        <td>⭐ ${cli.pontos.toFixed(0)}</td>
                        <td style="font-size:12px; color:#64748b;">${cli.dataObs || '-'}</td>
                        <td style="${corDivida}">R$ ${cli.divida.toFixed(2)}</td>
                        <td style="display:flex; gap:5px; flex-wrap: wrap;">
                            <button onclick="abrirModalEditarCliente('${id}')" style="background: var(--alerta); color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer;">✏️ Editar</button>
                            ${cli.divida > 0 ? `<button onclick="quitarDivida('${id}')" style="background: var(--sucesso); color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer;">💰 Quitar</button>` : ''}
                            ${cli.divida > 0 && cli.telefone ? `<button onclick="cobrarFiadoWhatsApp('${id}')" style="background: #25D366; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer;">📲 Cobrar</button>` : ''}
                        </td>
                    </tr>
                `;
            }
        }

        function quitarDivida(id) {
            if (confirm(`Deseja zerar a dívida de R$ ${clientesDB[id].divida.toFixed(2)} do cliente ${clientesDB[id].nome}?`)) {
                clientesDB[id].divida = 0; 
                clientesDB[id].dataObs = `Dívida quitada em ${new Date().toLocaleDateString('pt-BR')}`;
                salvarClientes(); 
                registrarLog(`Dívida quitada: ${clientesDB[id].nome}`, 'sucesso');
            }
        }

        function cobrarFiadoWhatsApp(id) {
            let cli = clientesDB[id]; 
            let num = cli.telefone.replace(/\D/g, ''); 
            if(num.length < 10) return alert("Telefone inválido!");
            let msg = encodeURIComponent(`Olá ${cli.nome}, tudo bem? Aqui é do Mercadinho Dois Irmãos. Informamos que o saldo atual da sua caderneta (fiado) é de R$ ${cli.divida.toFixed(2)}. Qualquer dúvida, estamos à disposição!`);
            window.open(`https://api.whatsapp.com/send?phone=55${num}&text=${msg}`, '_blank');
        }

        function abrirModalEditarCliente(id) {
            clienteEmEdicao = id;
            let cli = clientesDB[id];
            document.getElementById('edit-cli-id').value = id;
            document.getElementById('edit-cli-nome').value = cli.nome;
            document.getElementById('edit-cli-tel').value = cli.telefone || '';
            document.getElementById('edit-cli-divida').value = cli.divida.toFixed(2);
            document.getElementById('edit-cli-pontos').value = cli.pontos || 0;
            document.getElementById('edit-cli-data').value = cli.dataObs || '';
            document.getElementById('modal-editar-cliente').classList.add('ativo');
        }

        function fecharModalEditarCliente() {
            clienteEmEdicao = null;
            document.getElementById('modal-editar-cliente').classList.remove('ativo');
        }

        function salvarEdicaoCliente() {
            if (!clienteEmEdicao) return;
            let nome = document.getElementById('edit-cli-nome').value.trim();
            let tel = document.getElementById('edit-cli-tel').value.trim();
            let divida = parseFloat(document.getElementById('edit-cli-divida').value) || 0;
            let pontos = parseFloat(document.getElementById('edit-cli-pontos').value) || 0;
            let dataObs = document.getElementById('edit-cli-data').value.trim();

            if (!nome) return alert("O nome não pode ficar vazio!");

            clientesDB[clienteEmEdicao] = { nome: nome, telefone: tel, divida: divida, pontos: pontos, dataObs: dataObs };
            salvarClientes();
            fecharModalEditarCliente();
            alert("Cadastro do cliente atualizado com sucesso!");
        }

        function excluirClienteAtual() {
            if (!clienteEmEdicao) return;
            if (clientesDB[clienteEmEdicao].divida > 0) {
                if (!confirm(`ATENÇÃO! O cliente ${clientesDB[clienteEmEdicao].nome} ainda deve R$ ${clientesDB[clienteEmEdicao].divida.toFixed(2)}. Deseja realmente excluir e APAGAR esta dívida?`)) return;
            } else {
                if (!confirm(`Deseja excluir permanentemente o cadastro de ${clientesDB[clienteEmEdicao].nome}?`)) return;
            }
            
            delete clientesDB[clienteEmEdicao];
            salvarClientes();
            fecharModalEditarCliente();
            alert("Cliente excluído do sistema.");
        }

        // ==========================================
        // DEMAIS FUNÇÕES DO SISTEMA
        // ==========================================
        async function carregarEstoqueCompletoDaNuvem() {
            let repo = localStorage.getItem('cloud_repo') || 'rafaelxt1033-gif/pdvmercadodoluiz';
            registrarLog("Buscando banco na nuvem...", "alerta");
            try {
                let res = await fetch(`https://raw.githubusercontent.com/${repo}/main/precos.json?t=${new Date().getTime()}`);
                if (res.ok) { 
                    let d = await res.json(); 
                    if(Object.keys(d).length > 0){ 
                        estoqueCloud = d; 
                        localStorage.setItem('estoque_mercado', JSON.stringify(estoqueCloud)); 
                        return; 
                    } 
                }
            } catch(e) {}
            estoqueCloud = busterProdutosBackup; 
            localStorage.setItem('estoque_mercado', JSON.stringify(estoqueCloud));
        }

        function cadastrarProdutoLocal() {
            let cod = document.getElementById('novo-cod').value.trim(); 
            let nome = document.getElementById('novo-nome').value.trim().toUpperCase(); 
            let preco = parseFloat(document.getElementById('novo-preco').value.replace(',', '.'));
            if(!cod || !nome || !preco || preco <= 0) return alert("Preencha tudo!");
            
            estoqueCloud[cod] = { nome: nome, preco: preco }; 
            localStorage.setItem('estoque_mercado', JSON.stringify(estoqueCloud));
            precosModificadosManualmente[cod] = { nome: nome, preco: preco }; 
            localStorage.setItem('precos_modificados', JSON.stringify(precosModificadosManualmente));
            
            forcarSincronizacaoNuvemSilenciosa(); 
            alert("Salvo!"); 
            document.getElementById('novo-cod').value = ''; 
            document.getElementById('novo-nome').value = ''; 
            document.getElementById('novo-preco').value = ''; 
            renderizarTabelaAdm();
        }

        function toggleVisualizacaoFaturamento() {
            const btn = document.getElementById('btn-olho-faturamento');
            if (!faturamentoVisivel) { 
                let senha = prompt("Senha do Gerente:"); 
                if (senha === 'kd041022') { 
                    faturamentoVisivel = true; 
                    btn.innerText = "👁️"; 
                    atualizarDashboard(); 
                } else if (senha !== null) alert("Incorreta!"); 
            } else { 
                faturamentoVisivel = false; 
                btn.innerText = "👁️‍🗨️"; 
                atualizarDashboard(); 
            }
        }

        function atualizarDashboard() {
            let totalFinanceiro = 0; 
            vendasRealizadas.forEach(v => totalFinanceiro += v.total);
            const txtTotal = document.getElementById('dash-total');
            if (faturamentoVisivel) { txtTotal.innerText = "R$ " + formatarMoeda(totalFinanceiro); } else { txtTotal.innerText = "R$ ***"; }
            document.getElementById('dash-qtd').innerText = vendasRealizadas.length;
        }

        function zerarVendas() {
            if(confirm("Deseja fechar o expediente e zerar o dashboard?")) {
                vendasRealizadas = []; 
                localStorage.setItem('vendas', JSON.stringify([])); 
                localStorage.setItem('vendas_realizadas', JSON.stringify([]));
                faturamentoVisivel = false; 
                document.getElementById('btn-olho-faturamento').innerText = "👁️‍🗨️"; 
                atualizarDashboard(); 
                registrarLog("Expediente zerado.", "alerta");
            }
        }

        function salvarConfiguracaoNuvem() {
            localStorage.setItem('cloud_repo', document.getElementById('cloud-repo').value.trim()); 
            localStorage.setItem('cloud_token', document.getElementById('cloud-token').value.trim());
            alert("Salvo!"); 
            carregarEstoqueCompletoDaNuvem().then(() => renderizarTabelaAdm());
        }

        async function forcarSincronizacaoNuvem() {
            let repo = localStorage.getItem('cloud_repo'); 
            let token = localStorage.getItem('cloud_token'); 
            if(!repo || !token) return alert("Configure o Repositório e o Token no Painel ADM!");
            
            registrarLog("Enviando banco...", "alerta");
            try {
                let sha = ""; 
                let url = `https://api.github.com/repos/${repo}/contents/precos.json`;
                let resCheck = await fetch(url, { headers: { "Authorization": `token ${token}` } }); 
                if(resCheck.ok) { let dataCheck = await resCheck.json(); sha = dataCheck.sha; }
                
                let bodyPayload = { message: "Sync Geral PDV", content: btoa(unescape(encodeURIComponent(JSON.stringify(estoqueCloud, null, 2)))), branch: "main" };
                if(sha) bodyPayload.sha = sha;
                
                let resUpload = await fetch(url, { method: "PUT", headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" }, body: JSON.stringify(bodyPayload) });
                if(resUpload.ok) { registrarLog("Nuvem atualizada!", "sucesso"); alert("Sucesso!"); } else { alert("Erro ao enviar para o GitHub."); }
            } catch(err) { alert("Erro de conexão."); }
        }

        async function forcarSincronizacaoNuvemSilenciosa() {
            let repo = localStorage.getItem('cloud_repo'); 
            let token = localStorage.getItem('cloud_token'); 
            if(!repo || !token) return;
            try {
                let sha = ""; 
                let url = `https://api.github.com/repos/${repo}/contents/precos.json`; 
                let resCheck = await fetch(url, { headers: { "Authorization": `token ${token}` } });
                if(resCheck.ok) { let dataCheck = await resCheck.json(); sha = dataCheck.sha; }
                
                let bodyPayload = { message: "Sync Item PDV", content: btoa(unescape(encodeURIComponent(JSON.stringify(estoqueCloud, null, 2)))), branch: "main" }; 
                if(sha) bodyPayload.sha = sha;
                
                await fetch(url, { method: "PUT", headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" }, body: JSON.stringify(bodyPayload) });
            } catch(e) {}
        }

        function pularDaUnidadeProBipe(e) { if (e.key === 'Enter') { e.preventDefault(); document.getElementById('codigo-barras').focus(); } }
        function fecharVendaComEnter(e) { if (e.key === 'Enter') { e.preventDefault(); finalizarVenda(true); } }

        function manterFocoNoInput() {
            document.addEventListener('click', (e) => {
                const dropBarra = document.getElementById('dropdown-sugestoes'); 
                const dropBalanca = document.getElementById('dropdown-balanca'); 
                const dropEdicao = document.getElementById('dropdown-edicao-preco');
                const isPdv = document.getElementById('tela-pdv').classList.contains('ativa'); 
                const modalPreco = document.getElementById('modal-editar-preco').classList.contains('ativo'); 
                const modalBusca = document.getElementById('modal-busca').classList.contains('ativo'); 
                const modalCli = document.getElementById('modal-editar-cliente').classList.contains('ativo');
                
                if(!document.getElementById('peso-balanca').contains(e.target) && !document.getElementById('codigo-balanca').contains(e.target) && !dropBalanca.contains(e.target)) dropBalanca.style.display = 'none';
                if(!document.getElementById('codigo-barras').contains(e.target) && !dropBarra.contains(e.target)) dropBarra.style.display = 'none';
                if(!document.getElementById('edit-cod').contains(e.target) && !dropEdicao.contains(e.target)) dropEdicao.style.display = 'none';
                if (document.getElementById('peso-balanca').contains(e.target) || document.getElementById('codigo-balanca').contains(e.target) || dropBalanca.contains(e.target)) { return; }

                const ativo = document.activeElement.id;
                if (isPdv && !modalPreco && !modalBusca && !modalCli && !dropBarra.contains(e.target) && !dropBalanca.contains(e.target) && ativo !== 'valor-pago' && ativo !== 'forma-pagamento' && ativo !== 'cliente-selecionado' && ativo !== 'peso-balanca' && ativo !== 'codigo-balanca' && ativo !== 'input-qtd-manual') {
                    document.getElementById('codigo-barras').focus();
                }
            });
        }

        function mostrarTela(id) {
            document.querySelectorAll('.tela').forEach(t => t.classList.remove('ativa')); 
            document.getElementById(id).classList.add('ativa');
            if (id === 'tela-adm') { renderizarTabelaAdm(); renderizarTabelaClientes(); }
        }

        function fazerLogin() {
            const u = document.getElementById('login-usuario').value.toLowerCase().trim(); 
            const s = document.getElementById('login-senha').value.trim();
            if (u === 'eduardo' && s === 'kd041022') { document.getElementById('btn-painel-atalho').style.display = 'block'; document.getElementById('caixa-nome-status').innerText = 'Eduardo'; mostrarTela('tela-pdv'); } 
            else if (u === 'caixa' && s === '123') { document.getElementById('btn-painel-atalho').style.display = 'none'; document.getElementById('caixa-nome-status').innerText = 'Caixa'; mostrarTela('tela-pdv'); } 
            else { alert("Senha incorreta!"); }
        }
        
        function sair() { mostrarTela('tela-login'); cupomAtual = []; faturamentoVisivel = false; document.getElementById('btn-olho-faturamento').innerText = "👁️‍🗨️"; renderizarCupom(); }

        function registrarLog(msg, tipo='info') { const log = document.getElementById('log-sistema'); const col = tipo === 'erro' ? '#ef4444' : tipo === 'alerta' ? '#f59e0b' : tipo === 'sucesso' ? '#10b981' : '#38bdf8'; log.innerHTML = `<div style="color:${col}">[SISTEMA] ${msg}</div>` + log.innerHTML; }

        function abrirModalBusca() { document.getElementById('modal-busca').classList.add('ativo'); document.getElementById('campo-consulta').value = ''; document.getElementById('resultado-busca').innerHTML = ''; setTimeout(() => document.getElementById('campo-consulta').focus(), 100); }
        function fecharModalBusca() { document.getElementById('modal-busca').classList.remove('ativo'); document.getElementById('codigo-barras').focus(); }
        
        function executarBusca(val) {
            let res = document.getElementById('resultado-busca'); let t = val.toLowerCase().trim(); clearTimeout(timeoutBusca);
            if(!t) { res.innerHTML = ''; return; } res.innerHTML = '<div style="padding:15px; text-align:center; color:#666;">Processando...</div>';
            timeoutBusca = setTimeout(() => {
                if (isNaN(t) && t.length < 3) { res.innerHTML = '<div style="padding:15px; text-align:center; color:var(--alerta); font-weight:bold;">Digite pelo menos 3 letras...</div>'; return; }
                let htmlFinal = ''; let contador = 0; const maxResultados = 30;
                for (let c in estoqueCloud) {
                    let p = estoqueCloud[c];
                    if (p && p.nome && (p.nome.toLowerCase().includes(t) || c.includes(t))) { htmlFinal += `<div style="padding:10px; border-bottom:1px solid #eee; font-weight:bold;">📦 ${p.nome} <br> <span style="color:var(--secundaria)">Preço: R$ ${p.preco.toFixed(2)}</span> <small style="color:#666; float:right;">Cód: ${c}</small></div>`; contador++; }
                    if (contador >= maxResultados) { htmlFinal += `<div style="padding:10px; text-align:center; color:#666; font-size:13px; font-style:italic;">Mostrando ${maxResultados} resultados...</div>`; break; }
                }
                if (contador === 0) { htmlFinal = `<div style="padding:15px; text-align:center; color:var(--erro); font-weight:bold;">Não encontrado.</div>`; } res.innerHTML = htmlFinal;
            }, 300);
        }

        function abrirModalPreco() { document.getElementById('modal-editar-preco').classList.add('ativo'); document.getElementById('edit-cod').value = ''; document.getElementById('edit-cod-selecionado').value = ''; document.getElementById('edit-codigo-novo').value = ''; document.getElementById('edit-preco').value = ''; document.getElementById('edit-senha').value = ''; document.getElementById('edit-nome-prod').innerText = ''; setTimeout(() => document.getElementById('edit-cod').focus(), 100); }
        function fecharModalPreco() { document.getElementById('modal-editar-preco').classList.remove('ativo'); document.getElementById('codigo-barras').focus(); }
        
        function filtrarPorNome(val) {
            const txt = val.toLowerCase().trim(); const drop = document.getElementById('dropdown-sugestoes'); drop.innerHTML = ''; indiceSelecionadoSugestoes = -1;
            if(!txt || !isNaN(txt)) { drop.style.display = 'none'; return; }
            listaFiltrada = Object.keys(estoqueCloud).filter(c => estoqueCloud[c].nome.toLowerCase().includes(txt)).slice(0, 15);
            if(listaFiltrada.length > 0) { drop.style.display = 'block'; let qtdAtiva = parseFloat(document.getElementById('input-qtd-manual').value || 1); listaFiltrada.forEach((c, idx) => drop.innerHTML += `<div class="opcao-busca" id="opt-sugestao-${idx}" onclick="addCupom('${c}', ${qtdAtiva})"><span>📦 ${estoqueCloud[c].nome}</span> <span>R$ ${estoqueCloud[c].preco.toFixed(2)}</span></div>`);
            } else { drop.style.display = 'none'; }
        }

        function filtrarNomeBalanca(val) {
            const txt = val.toLowerCase().trim(); const drop = document.getElementById('dropdown-balanca'); drop.innerHTML = ''; indiceSelecionadoBalanca = -1;
            if(!txt) { drop.style.display = 'none'; return; }
            listaFiltrada = Object.keys(estoqueCloud).filter(c => estoqueCloud[c].nome.toLowerCase().includes(txt)).slice(0, 10);
            if(listaFiltrada.length > 0) { drop.style.display = 'block'; listaFiltrada.forEach((c, idx) => { drop.innerHTML += `<div class="opcao-busca" id="opt-balanca-${idx}" onclick="addCupomBalanca('${c}')"><span>⚖️ ${estoqueCloud[c].nome}</span> <span>R$ ${estoqueCloud[c].preco.toFixed(2)}/Kg</span></div>`; });
            } else { drop.style.display = 'none'; }
        }

        function buscarParaEdicao(val) {
            let txt = val.toLowerCase().trim(); let label = document.getElementById('edit-nome-prod'); let drop = document.getElementById('dropdown-edicao-preco'); drop.innerHTML = ''; indiceSelecionadoEdicao = -1;
            if(!txt) { drop.style.display = 'none'; label.innerText = ''; return; }
            if(!isNaN(txt) && txt.length >= 3) { if (estoqueCloud[txt]) { selecionarProdutoParaPreco(txt); return; } }
            listaFiltrada = Object.keys(estoqueCloud).filter(c => estoqueCloud[c].nome.toLowerCase().includes(txt)).slice(0, 5);
            if(listaFiltrada.length > 0) { drop.style.display = 'block'; listaFiltrada.forEach((c, idx) => { drop.innerHTML += `<div class="opcao-busca" id="opt-edicao-${idx}" onclick="selecionarProdutoParaPreco('${c}')"><span>✏️ ${estoqueCloud[c].nome}</span> <span>R$ ${estoqueCloud[c].preco.toFixed(2)}</span></div>`; });
            } else { drop.style.display = 'none'; label.innerText = "Produto não encontrado"; label.style.color = "var(--erro)"; }
        }

        function selecionarProdutoParaPreco(cod) {
            document.getElementById('edit-cod').value = estoqueCloud[cod].nome; document.getElementById('edit-cod-selecionado').value = cod; document.getElementById('edit-codigo-novo').value = cod; document.getElementById('edit-preco').value = estoqueCloud[cod].preco.toFixed(2);
            let label = document.getElementById('edit-nome-prod'); label.innerText = `✅ Selecionado: ${estoqueCloud[cod].nome}`; label.style.color = "var(--sucesso)"; document.getElementById('dropdown-edicao-preco').style.display = 'none'; document.getElementById('edit-codigo-novo').focus();
        }

        function navegarSugestoes(e) {
            const drop = document.getElementById('dropdown-sugestoes'); const opcoes = drop.querySelectorAll('.opcao-busca');
            if (drop.style.display === 'block' && opcoes.length > 0) {
                if (e.key === 'ArrowDown') { e.preventDefault(); if (indiceSelecionadoSugestoes < opcoes.length - 1) { if (indiceSelecionadoSugestoes >= 0) opcoes[indiceSelecionadoSugestoes].classList.remove('selecionada'); indiceSelecionadoSugestoes++; opcoes[indiceSelecionadoSugestoes].classList.add('selecionada'); opcoes[indiceSelecionadoSugestoes].scrollIntoView({ block: 'nearest' }); } return;
                } else if (e.key === 'ArrowUp') { e.preventDefault(); if (indiceSelecionadoSugestoes > 0) { if (indiceSelecionadoSugestoes >= 0) opcoes[indiceSelecionadoSugestoes].classList.remove('selecionada'); indiceSelecionadoSugestoes--; opcoes[indiceSelecionadoSugestoes].classList.add('selecionada'); opcoes[indiceSelecionadoSugestoes].scrollIntoView({ block: 'nearest' }); } return;
                } else if (e.key === 'Enter' && indiceSelecionadoSugestoes >= 0) { e.preventDefault(); let qtdAtiva = parseFloat(document.getElementById('input-qtd-manual').value || 1); addCupom(listaFiltrada[indiceSelecionadoSugestoes], qtdAtiva); document.getElementById('input-qtd-manual').value = "1"; return; }
            }
            if(e.key === 'Enter') {
                e.preventDefault(); let txt = document.getElementById('codigo-barras').value.trim();
                if(!txt) { if (cupomAtual.length === 0) return alert("Passe os produtos!"); document.getElementById('valor-pago').focus(); document.getElementById('valor-pago').select(); return; }
                let qtd = parseFloat(document.getElementById('input-qtd-manual').value || 1); let cod = txt;
                if(txt.includes('*')) { qtd = parseFloat(txt.split('*')[0]); cod = txt.split('*')[1]; }
                if(estoqueCloud[cod]) { addCupom(cod, qtd); document.getElementById('input-qtd-manual').value = "1"; } 
                else { registrarLog("Código não encontrado: " + cod, "erro"); document.getElementById('codigo-barras').value = ''; }
            }
        }

            const drop = document.getElementById('dropdown-balanca'); const opcoes = drop.querySelectorAll('.opcao-busca');
            if (drop.style.display === 'block' && opcoes.length > 0) {
                if (e.key === 'ArrowDown') { e.preventDefault(); if (indiceSelecionadoBalanca < opcoes.length - 1) { if (indiceSelecionadoBalanca >= 0) opcoes[indiceSelecionadoBalanca].classList.remove('selecionada'); indiceSelecionadoBalanca++; opcoes[indiceSelecionadoBalanca].classList.add('selecionada'); opcoes[indiceSelecionadoBalanca].scrollIntoView({ block: 'nearest' }); }
                } else if (e.key === 'ArrowUp') { e.preventDefault(); if (indiceSelecionadoBalanca > 0) { opcoes[indiceSelecionadoBalanca].classList.remove('selecionada'); indiceSelecionadoBalanca--; opcoes[indiceSelecionadoBalanca].classList.add('selecionada'); opcoes[indiceSelecionadoBalanca].scrollIntoView({ block: 'nearest' }); }
                } else if (e.key === 'Enter' && indiceSelecionadoBalanca >= 0) { e.preventDefault(); addCupomBalanca(listaFiltrada[indiceSelecionadoBalanca]); }
            }
        }

        function navegarSugestoesEdicao(e) {
            const drop = document.getElementById('dropdown-edicao-preco'); const opcoes = drop.querySelectorAll('.opcao-busca');
            if (drop.style.display === 'block' && opcoes.length > 0) {
                if (e.key === 'ArrowDown') { e.preventDefault(); if (indiceSelecionadoEdicao < opcoes.length - 1) { if (indiceSelecionadoEdicao >= 0) opcoes[indiceSelecionadoEdicao].classList.remove('selecionada'); indiceSelecionadoEdicao++; opcoes[indiceSelecionadoEdicao].classList.add('selecionada'); opcoes[indiceSelecionadoEdicao].scrollIntoView({ block: 'nearest' }); }
                } else if (e.key === 'ArrowUp') { e.preventDefault(); if (indiceSelecionadoEdicao > 0) { opcoes[indiceSelecionadoEdicao].classList.remove('selecionada'); indiceSelecionadoEdicao--; opcoes[indiceSelecionadoEdicao].classList.add('selecionada'); opcoes[indiceSelecionadoEdicao].scrollIntoView({ block: 'nearest' }); }
                } else if (e.key === 'Enter' && indiceSelecionadoEdicao >= 0) { e.preventDefault(); selecionarProdutoParaPreco(listaFiltrada[indiceSelecionadoEdicao]); }
            }
        }

        function salvarNovoPreco() {
            let codAntigo = document.getElementById('edit-cod-selecionado').value.trim(); 
            let codNovo = document.getElementById('edit-codigo-novo').value.trim(); 
            let precoFormatado = parseFloat(document.getElementById('edit-preco').value.replace(',', '.')); 
            let senha = document.getElementById('edit-senha').value;
            
            if (!codAntigo || !estoqueCloud[codAntigo]) return alert("Selecione um produto válido!"); 
            if (!codNovo) return alert("O código não pode ficar vazio!"); 
            if (isNaN(precoFormatado) || precoFormatado <= 0) return alert("Digite um preço válido!"); 
            if (senha !== 'kd041022') return alert("Senha incorreta!");
            
            let nomeOriginal = estoqueCloud[codAntigo].nome; 
            if (codAntigo !== codNovo) { delete estoqueCloud[codAntigo]; precosModificadosManualmente[codAntigo] = null; }
            
            estoqueCloud[codNovo] = { nome: nomeOriginal, preco: precoFormatado }; 
            localStorage.setItem('estoque_mercado', JSON.stringify(estoqueCloud));
            precosModificadosManualmente[codNovo] = { nome: nomeOriginal, preco: precoFormatado }; 
            localStorage.setItem('precos_modificados', JSON.stringify(precosModificadosManualmente));
            
            fecharModalPreco(); 
            forcarSincronizacaoNuvemSilenciosa(); 
            alert(`Sucesso!`);
        }

        function addCupom(cod, qtd) {
            const p = estoqueCloud[cod]; 
            cupomAtual.push({ cod: cod, nome: p.nome, qtd: qtd, unit: p.preco, total: p.preco * qtd });
            document.getElementById('codigo-barras').value = ''; 
            document.getElementById('dropdown-sugestoes').style.display = 'none'; 
            registrarLog(`Adicionado: ${qtd}x ${p.nome}`, 'sucesso'); 
            renderizarCupom(); 
            document.getElementById('codigo-barras').focus();
        }

        function addCupomBalanca(cod) {
            let peso = parseFloat(document.getElementById('peso-balanca').value); 
            if (!peso || peso <= 0) { alert("Digite o peso!"); document.getElementById('peso-balanca').focus(); return; }
            const p = estoqueCloud[cod]; 
            cupomAtual.push({ cod: cod, nome: p.nome, qtd: peso, unit: p.preco, total: p.preco * peso });
            document.getElementById('peso-balanca').value = ''; 
            document.getElementById('codigo-balanca').value = ''; 
            document.getElementById('dropdown-balanca').style.display = 'none'; 
            document.getElementById('codigo-barras').focus();
            registrarLog(`Pesado: ${peso}kg de ${p.nome}`, 'sucesso'); 
            renderizarCupom();
        }

        function removerItem(idx) { cupomAtual.splice(idx, 1); renderizarCupom(); }
        function cancelarCupom() { if(confirm("Cancelar compra?")) { cupomAtual = []; renderizarCupom(); registrarLog("Compra Cancelada", "erro"); } }

        function renderizarCupom() {
            const lista = document.getElementById('lista-cupom'); 
            lista.innerHTML = ''; 
            totalVenda = 0;
            cupomAtual.forEach((item, i) => { 
                totalVenda += item.total; 
                let unidade = Number.isInteger(item.qtd) ? 'UN' : 'KG'; 
                lista.innerHTML += `<div class="item-cupom"><span>${item.nome}</span><span style="text-align:center">${item.qtd} <span class="badge-unidade">${unidade}</span></span><span style="text-align:right">${item.unit.toFixed(2)}</span><span style="text-align:right; font-weight:bold; color:var(--secundaria);">${item.total.toFixed(2)}</span><button class="btn-remover" onclick="removerItem(${i})">❌</button></div>`; 
            });
            document.getElementById('valor-total').innerText = totalVenda.toFixed(2); 
            calcularTroco();
        }

        function calcularTroco() {
            const pago = parseFloat(document.getElementById('valor-pago').value || 0); 
            const box = document.getElementById('box-troco');
            if(pago >= totalVenda && totalVenda > 0) { box.innerText = `Troco: R$ ${(pago - totalVenda).toFixed(2)}`; box.style.color = '#4ade80'; } 
            else { box.innerText = `Troco: R$ 0.00`; box.style.color = '#38bdf8'; }
        }

        function formatarMoeda(valor) { return valor.toFixed(2).replace('.', ','); }

        function gerarCupomPDV(formaPagto) {
            let containerAntigo = document.getElementById('recibo-impressao'); 
            if(containerAntigo) containerAntigo.remove();
            let dataAtual = new Date().toLocaleString('pt-BR'); 
            let pedidoNumber = Math.floor(Math.random() * 90000) + 10000;
            let pago = parseFloat(document.getElementById('valor-pago').value || totalVenda); 
            let troco = pago > totalVenda ? pago - totalVenda : 0;
            let html = `<div id="recibo-impressao"><div class="txt-centro" style="font-size:14px;">MERCADINHO DOIS IRMAOS</div><div class="txt-centro">Rua Padre Cicero, 375, Felipe Camarão</div><div class="txt-centro" style="margin-bottom:5px;">${dataAtual} - Pedido ${pedidoNumber}</div><div class="linha-tracejada"></div><div class="flex-space"><span>Qtd Descrição</span><span>Total</span></div><div class="linha-tracejada"></div><div style="margin-bottom:4px;">`;
            cupomAtual.forEach(i => { let und = Number.isInteger(i.qtd) ? 'UN' : 'KG'; html += `<div style="margin-bottom:4px;"><div>${i.qtd} ${und} x ${i.nome}</div><div class="txt-direita">${formatarMoeda(i.total)}</div></div>`; });
            html += `</div><div class="linha-tracejada"></div><div class="flex-space" style="font-size:13px; margin-top:5px;"><span>Total a pagar</span><span>R$ ${formatarMoeda(totalVenda)}</span></div><div class="flex-space"><span>${formaPagto}</span><span>R$ ${formatarMoeda(pago)}</span></div><div class="flex-space"><span>VALOR TROCO</span><span>R$ ${formatarMoeda(troco)}</span></div><div style="margin-top:5px;">Vendedor: ${document.getElementById('caixa-nome-status').innerText}</div><div class="txt-centro" style="margin-top:15px;">Obrigado!</div></div>`;
            let divElement = document.createElement('div'); divElement.innerHTML = html; document.body.appendChild(divElement.firstElementChild);
        }

        function gerarNFCe(formaPagto) {
            let containerAntigo = document.getElementById('recibo-impressao'); 
            if(containerAntigo) containerAntigo.remove();
            let dataStr = new Date().toLocaleDateString('pt-BR'); 
            let horaStr = new Date().toLocaleTimeString('pt-BR'); 
            let pago = parseFloat(document.getElementById('valor-pago').value || totalVenda); 
            let troco = pago > totalVenda ? pago - totalVenda : 0;
            let html = `<div id="recibo-impressao"><div class="txt-centro">CNPJ: 44.133.465/0001-96 MERCADINHO DOIS IRMAOS LTDA<br>RUA PADRE CICERO, 375 FELIPE CAMARAO - NATAL - RN<br>Fone: (84)98631-5330 I.E.: 20.591.002-5<br>DOCUMENTO AUXILIAR DA NOTA FISCAL DE CONSUMIDOR ELETRÔNICA</div><div class="linha-tracejada"></div><div># Descrição do Item / Qtd Un Vl Unit. Vl Total</div><div class="linha-tracejada"></div><div style="margin-bottom:5px;">`;
            cupomAtual.forEach((i, index) => { let numItem = String(index + 1).padStart(3, '0'); let und = Number.isInteger(i.qtd) ? 'UN' : 'KG'; html += `<div style="margin-bottom:4px;"><div>${numItem} ${i.nome.toUpperCase()}</div><div class="flex-space" style="padding-left:15px;"><span>${i.qtd} ${und} X ${formatarMoeda(i.unit)}</span><span>${formatarMoeda(i.total)}</span></div></div>`; });
            html += `</div><div class="linha-tracejada"></div><div class="flex-space"><span>QTD. TOTAL DE ITENS</span><span>${String(cupomAtual.length).padStart(3, '0')}</span></div><div class="flex-space"><span>VALOR TOTAL R$</span><span>${formatarMoeda(totalVenda)}</span></div><div class="flex-space"><span>FORMA DE PAGAMENTO</span><span>Valor Pago</span></div><div class="flex-space"><span>${formaPagto}</span><span>R$ ${formatarMoeda(pago)}</span></div><div class="flex-space"><span>VALOR TROCO R$</span><span>R$ ${formatarMoeda(troco)}</span></div><div class="linha-tracejada" style="margin-top:5px;"></div><div class="txt-centro" style="margin-top: 5px;">Consulte pela Chave de Acesso em<br>www.set.rn.gov.br/nfce/consulta<br>2426 0744 1334 6500 0196 6500 1000 0057 0210 0038 4190<br><strong>CONSUMIDOR NÃO IDENTIFICADO</strong><br>NFC-e nº 000005702 Série 001 ${dataStr} ${horaStr}<br>Protocolo de Autorização: 224260250855527<br>Data de Autorização ${dataStr} ${horaStr}</div><div id="qrcode-recibo"></div></div>`;
            let divElement = document.createElement('div'); divElement.innerHTML = html; document.body.appendChild(divElement.firstElementChild);
            new QRCode(document.getElementById("qrcode-recibo"), { text: "https://www.set.rn.gov.br/nfce/consulta?p=24260744133465000196650010000057021000384190", width: 130, height: 130, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.L });
        }

        async function finalizarVenda(nfce) {
            if(cupomAtual.length === 0) return alert("Passe os produtos primeiro!");
            
            const formaPagto = document.getElementById('forma-pagamento').value;
            const clienteId = document.getElementById('cliente-selecionado').value;
            
            if (formaPagto === 'Fiado') {
                if (!clienteId) return alert("Para vender fiado, selecione um cliente cadastrado!");
                clientesDB[clienteId].divida += totalVenda;
                clientesDB[clienteId].dataObs = `Última compra fiado em ${new Date().toLocaleDateString('pt-BR')}`;
            }
            
            if (clienteId) {
                clientesDB[clienteId].pontos += totalVenda;
                salvarClientes(); 
            }
            
            vendasRealizadas.push({ data: new Date().toLocaleString('pt-BR'), total: totalVenda, pagamento: formaPagto, cliente: clienteId ? clientesDB[clienteId].nome : 'Avulso' });
            setTimeout(() => { localStorage.setItem('vendas', JSON.stringify(vendasRealizadas)); }, 50);
            atualizarDashboard();

            if(nfce) { gerarNFCe(formaPagto); setTimeout(() => { window.print(); }, 200); } 
            else { gerarCupomPDV(formaPagto); setTimeout(() => { window.print(); }, 100); }
            
            cupomAtual = []; totalVenda = 0;
            document.getElementById('valor-pago').value = ''; 
            document.getElementById('cliente-selecionado').value = ''; 
            document.getElementById('forma-pagamento').value = 'Dinheiro'; 
            renderizarCupom(); 
            setTimeout(() => { document.getElementById('input-qtd-manual').focus(); document.getElementById('input-qtd-manual').select(); }, 500);
        }
